###
# Konfigurasi aplikasi untuk lingkungan development
# Dokumentasi: https://docs.pylonsproject.org/projects/pyramid/en/latest/narr/environment.html
###

[app:main]
use = egg:pyramid_mahasiswa

pyramid.debug_authorization = false
pyramid.debug_notfound = false
pyramid.debug_routematch = false
pyramid.default_locale_name = en

# HANDS-ON (Tahap 3, Langkah 3): koneksi database PostgreSQL
# Baris SQLite bawaan template dimatikan:
# sqlalchemy.url = sqlite:///%(here)s/pyramid_mahasiswa.sqlite
sqlalchemy.url = postgresql+psycopg2://pyramid_user:pyramid_pass@localhost:5432/pyramid_mahasiswa

[alembic]
# Lokasi skrip migrasi dan format nama berkas revisi
script_location = pyramid_mahasiswa:alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(slug)s

[server:main]
use = egg:waitress#main
listen = localhost:6543

###
# Konfigurasi logging
###

[loggers]
keys = root, pyramid_mahasiswa, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_pyramid_mahasiswa]
level = DEBUG
handlers =
qualname = pyramid_mahasiswa

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s:%(lineno)s][%(threadName)s] %(message)s
