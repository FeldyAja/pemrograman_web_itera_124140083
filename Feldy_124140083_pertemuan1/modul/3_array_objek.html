<!DOCTYPE html>
<html lang="id">
<head>
    <title>Latihan Array & Objek</title>
    <link rel="stylesheet" href="style_latihan.css">
</head>
<body>
    <h2>Latihan 3: Array & Objek (CRUD Mahasiswa)</h2>
    
    <div class="section">
        <input type="text" id="namaMhs" placeholder="Nama Mahasiswa">
        <input type="text" id="nimMhs" placeholder="NIM">
        <input type="number" id="nilaiMhs" placeholder="Nilai">
        <button onclick="tambahMhs()">Tambah Data</button>
        <button onclick="filterAtasRataRata()">Filter > Rata-Rata</button>
        <button onclick="urutkanNama()">Sort Nama Asc</button>
        <button onclick="cariTertinggi()">Cari Tertinggi</button>
    </div>

    <table>
        <thead>
            <tr><th>NIM</th><th>Nama</th><th>Nilai</th><th>Aksi</th></tr>
        </thead>
        <tbody id="tabelMhs"></tbody>
    </table>
    <script src="3_array_objek.js"></script>
</body>
</html>
