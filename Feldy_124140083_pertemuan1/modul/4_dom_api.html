<!DOCTYPE html>
<html lang="id">
<head>
    <title>Latihan DOM & API</title>
    <link rel="stylesheet" href="style_latihan.css">
</head>
<body>
    <button onclick="toggleDarkMode()">Toggle Dark Mode</button>
    
    <div class="section">
        <h2>Todo List (LocalStorage)</h2>
        <input type="text" id="inputTodo" placeholder="Tugas baru...">
        <button onclick="tambahTodo()">Tambah</button>
        <ul id="listTodo"></ul>
    </div>

    <div class="section">
        <h2>Daftar Post (Fetch API & Pagination)</h2>
        <input type="text" id="cariPost" placeholder="Cari judul post..." oninput="cariData()">
        <div id="apiOutput"></div>
        <button onclick="gantiHalaman(-1)">Previous</button>
        <span id="infoHalaman">1</span>
        <button onclick="gantiHalaman(1)">Next</button>
    </div>

    <script src="4_dom_api.js"></script>
</body>
</html>
