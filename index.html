<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Cuaca & Waktu</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hero">
    <p id="greeting" class="greeting"></p>
    <time id="clock" class="clock">--:--:--</time>
    <p id="date" class="date"></p>
    <p id="zone" class="zone"></p>
  </header>

  <main>
    <section class="toolbar">
      <form id="searchForm" class="search">
        <label for="q" class="sr">Cari kota</label>
        <input id="q" placeholder="Cari kota, contoh: Bandung" autocomplete="off" required>
        <button>Cari kota</button>
      </form>
      <button id="unitBtn" type="button" class="ghost"></button>
      <button id="refreshBtn" type="button" class="ghost">Perbarui cuaca</button>
    </section>

    <form id="coordForm" class="toolbar coords">
      <span>Tidak ketemu lewat pencarian? Masukkan koordinat:</span>
      <label class="sr" for="coordName">Nama lokasi</label>
      <input id="coordName" placeholder="Nama lokasi, contoh: ITB" maxlength="40">
      <label class="sr" for="coordLat">Latitude</label>
      <input id="coordLat" type="number" step="any" min="-90" max="90" placeholder="Latitude, contoh -6.8915" required>
      <label class="sr" for="coordLon">Longitude</label>
      <input id="coordLon" type="number" step="any" min="-180" max="180" placeholder="Longitude, contoh 107.6107" required>
      <button>Tambah lokasi</button>
    </form>

    <ul id="results" class="results" hidden></ul>
    <p id="status" class="status" role="status"></p>
    <section id="cities" class="grid"></section>
  </main>

  <dialog id="editDialog">
    <form id="editForm" method="dialog">
      <h2>Edit kota</h2>
      <label for="editName">Nama tampilan</label>
      <input id="editName" required maxlength="40">
      <label for="editLabel">Keterangan (boleh kosong)</label>
      <input id="editLabel" maxlength="60">
      <div class="dialog-actions">
        <button type="button" class="ghost" id="cancelEdit">Batal</button>
        <button>Simpan perubahan</button>
      </div>
    </form>
  </dialog>

  <!-- type="module" wajib, kalau tidak import/export tidak jalan -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
